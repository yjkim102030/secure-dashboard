<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src 'self'; worker-src blob:; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>접근 제한</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#59463b;font-family:Arial,'Malgun Gothic',sans-serif;min-height:100vh;display:grid;place-items:center}.lock{width:min(440px,calc(100vw - 40px));padding:34px;background:#fffdfa;border:1px solid #e5d7ca;border-radius:15px;box-shadow:0 15px 45px #70574815}h1{font-size:24px;margin:0 0 14px}p{font-size:14px;line-height:1.7;color:#806e61}label{display:block;font-size:13px;margin:24px 0 9px}input{width:100%;padding:13px;border:1px solid #d8c8b9;border-radius:7px;font-size:16px}button{width:100%;background:#9d6850;color:white;border:0;border-radius:7px;padding:13px;margin-top:15px;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{min-height:40px;font-size:13px;overflow-wrap:anywhere}.small{font-size:12px;color:#9a887b}
</style></head><body><main class="lock"><h1>보호된 분석 화면</h1><p>접속 비밀번호를 입력하세요.<br>자료는 비밀번호 확인 후 이 브라우저에서 열립니다.</p><label for="password">접속 비밀번호</label><input id="password" type="password" autocomplete="off" spellcheck="false"><button id="unlock" type="button">대시보드 열기</button><p id="status" role="status" aria-live="polite"></p><p class="small">권한을 부여받은 사용자만 이용할 수 있습니다.</p></main><script src="unlock.js"></script></body></html>
